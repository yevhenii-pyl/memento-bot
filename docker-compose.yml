services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: memento
      POSTGRES_PASSWORD: memento
      POSTGRES_DB: memento
    ports:
      - "5435:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memento"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    # Requires .env to exist: run `cp .env.example .env` and fill in BOT_TOKEN before `docker compose up`
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://memento:memento@db:5432/memento
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
